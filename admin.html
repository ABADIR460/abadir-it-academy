<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Abadir IT Academy</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-page"><header class="header"><nav class="container nav"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>Abadir <strong>IT Academy</strong></span></a><a href="index.html">← Public website</a></nav></header>
<main class="container admin-main"><section id="loginPanel" class="admin-panel login-panel"><span class="eyebrow">SECURE ADMIN AREA</span><h1>Admin Login</h1><p>Sign in to manage student registrations.</p><form id="loginForm" class="admin-form"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn btn-primary" type="submit">Login</button><p id="loginMsg" class="notice" role="status"></p></form></section>
<section id="dashboard" hidden><div class="admin-heading"><div><span class="eyebrow">ACADEMY MANAGEMENT</span><h1>Student Dashboard</h1><p>View and manage registration records.</p></div><button id="logoutBtn" class="btn btn-outline">Logout</button></div>
<div class="dashboard-stats"><div class="admin-panel"><span>Total students</span><strong id="studentCount">0</strong></div><div class="admin-panel"><span>Backend status</span><strong id="apiStatus">Checking…</strong></div></div>
<div class="admin-panel"><div class="table-toolbar"><h2>Registered students</h2><input id="search" type="search" placeholder="Search name, phone or course"></div><p id="tableMsg" class="notice" role="status"></p><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Course</th><th>Date</th><th>Actions</th></tr></thead><tbody id="studentRows"></tbody></table></div></div>
</section></main>
<dialog id="editDialog"><form id="editForm" class="admin-form"><h2>Edit student</h2><input type="hidden" id="editId"><label for="editName">Full name</label><input id="editName" required maxlength="120"><label for="editPhone">Phone</label><input id="editPhone" required maxlength="40"><label for="editEmail">Email</label><input id="editEmail" type="email" maxlength="160"><label for="editCourse">Course</label><input id="editCourse" required maxlength="120"><div class="dialog-actions"><button type="button" id="cancelEdit" class="btn btn-outline">Cancel</button><button class="btn btn-primary" type="submit">Save changes</button></div><p id="editMsg" class="notice" role="status"></p></form></dialog>
<script src="config.js"></script><script src="admin.js"></script></body></html>
