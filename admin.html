<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Abadir IT Academy</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand" href="index.html"><span class="logo">A</span>Abadir <b>IT Academy</b></a><a href="index.html">Home</a></header><main class="section"><div class="heading"><span class="tag">ADMINISTRATION</span><h2>Admin Dashboard</h2><p>Authorized academy administrators only.</p></div><form id="login" style="max-width:430px;margin:auto"><label>Username<input id="username" required></label><label style="margin-top:14px">Password<input id="password" type="password" required></label><button
  class="btn"
  type="submit"
  style="margin-top:18px"
  onclick="document.getElementById('msg').textContent='Login button works';"
>
  Login
</button><p id="msg"></p></form><section id="panel" hidden><h2>Registered Students</h2><button class="btn" id="load">Refresh students</button><p id="count"></p><div style="overflow:auto"><table id="students" style="width:100%;text-align:left;margin-top:18px"></table></div> 
<div class="section">
  <h2>Upload Learning Materials</h2>

  <form id="materialForm">
    <label>Material Title</label>
    <input id="materialTitle" type="text"
      placeholder="Enter lesson title" required>

    <label>Description</label>
    <textarea id="materialDescription"
      placeholder="Enter description"></textarea>

    <label>Material Type</label>
    <select id="materialType" required>
      <option value="pdf">PDF Notes</option>
      <option value="video">Video File</option>
      <option value="youtube">YouTube Video Link</option>
    </select>

    <div id="fileArea">
      <label>Select PDF or Video</label>
      <input id="materialFile" type="file"
        accept=".pdf,video/mp4,video/webm">
    </div>

    <div id="youtubeArea" hidden>
      <label>YouTube URL</label>
      <input id="youtubeUrl" type="url"
        placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <button type="submit" class="btn">
      Upload Material
    </button>

    <p id="materialMsg"></p>
  </form>
</div>

<div class="section">
  <h2>Uploaded Materials</h2>
  <div id="materialsList">Loading...</div>
</div><div class="section">
  <h2>📝 Online Exam Management</h2>

  <form id="examForm">
    <input
      type="text"
      id="examTitle"
      placeholder="Exam Title"
      required
    >

    <textarea
      id="examDescription"
      placeholder="Exam Description"
    ></textarea>

    <input
      type="number"
      id="examDuration"
      placeholder="Duration (Minutes)"
      min="1"
      required
    >

    <button type="submit">Create Exam</button>
  </form>

  <p id="examMsg"></p>

  <hr>

  <h3>Add Exam Questions</h3>

  <select id="examSelect" required>
    <option value="">Select Exam</option>
  </select>

  <form id="questionForm">
    <textarea
      id="examQuestion"
      placeholder="Write your question"
      required
    ></textarea>

    <input id="optionA" placeholder="Option A" required>
    <input id="optionB" placeholder="Option B" required>
    <input id="optionC" placeholder="Option C" required>
    <input id="optionD" placeholder="Option D" required>

    <select id="correctAnswer" required>
      <option value="">Correct Answer</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
    </select>

    <button type="submit">Add Question</button>
  </form>

  <p id="questionMsg"></p>

  <button type="button" id="publishExam">
    Publish Selected Exam
  </button>
</div>

<section class="card" id="examResults">
  <h2>📊 Exam Results</h2>
  <button onclick="loadExamResults()">
    Load Exam Results
  </button>
  <div id="examResultsList">
    Click Load Exam Results
  </div>
</section>
  <section class="card">
  <h2>Course Completion Approval</h2>

  <label>Student ID</label>
  <input type="number" id="approvalStudentId"
         placeholder="Enter student ID">

  <label>Course Name</label>
  <input type="text" id="approvalCourseName"
         placeholder="Enter course name">

  <button type="button" onclick="approveCourse()">
    Approve Course
  </button>

  <p id="approvalMessage"></p>
</section>
</main>

<script src="approval.js"></script>
<script src="admin.js?v=5"></script>

</body>
</html>
